name: b2ar_3sn6
structure: ../data/structures/3SN6_R.pdb
notes: >
  Active β2AR start (3SN6 chain R). Pair with b2ar_2rh1. Independent teacher
  from this basin; do not discover active from inactive-only MD.

objective:
  type: conformational_shift
  discover_cvs: false
  observables:
    - name: tm6_ic
      kind: distance
      selection: "name CA and resid 131 ; name CA and resid 272"
      precision: 0.2
    - name: ionic_lock
      kind: distance
      selection: "name CA and resid 131 ; name CA and resid 268"
      precision: 0.2
    - name: tm3_tm6_pack
      kind: distance
      selection: "name CA and resid 121 ; name CA and resid 282"
      precision: 0.2
    - name: npxxY
      kind: distance
      selection: "name CA and resid 326 ; name CA and resid 131"
      precision: 0.2

orientation:
  method: auto
  topology: out

membrane:
  lipids:
    POPC: 1.0
  optimize_size: true
  safety_margin_nm: 1.2
  water_pad_nm: 1.2
  ionic_strength_M: 0.15

compute:
  max_gpu_hours: 6.9
  max_wall_hours: 12

seed: 43
