name: glycophorin_5eh4
structure: ../data/structures/5EH4.pdb
notes: >
  Negative control. Glycophorin A TM dimer, PDB 5EH4 (X-ray, 2.81 Å), chains A+B.
  G83 CA–CA is one packed well; 20 ns conventional already pins μ≈0.46 nm. Adaptive
  select STOP'd. Do not use this as the acceleration benchmark. Next target is
  examples/b2ar.yaml (slow TM6). Fetch with scripts/fetch_pdb.sh 5EH4.

objective:
  type: conformational_shift
  observables:
    - name: g83_sep
      kind: distance
      selection: "chain A and resid 83 and name CA ; chain B and resid 83 and name CA"
      precision: 0.05

orientation:
  method: auto
  topology: in

membrane:
  lipids:
    POPC: 1.0
  optimize_size: true
  safety_margin_nm: 1.2
  water_pad_nm: 1.2
  ionic_strength_M: 0.15

compute:
  max_gpu_hours: 20
  max_wall_hours: 12

seed: 42
