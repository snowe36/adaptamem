      kind: distance
      selection: "name CA and resid 173 ; name CA and resid 322"
      precision: 0.2
    - name: ionic_lock
      kind: distance
      selection: "name CA and resid 173 ; name CA and resid 318"
      precision: 0.2
    - name: tm3_tm6_pack
      kind: distance
      selection: "name CA and resid 163 ; name CA and resid 332"
      precision: 0.2
    - name: npxxY
      kind: distance
      selection: "name CA and resid 380 ; name CA and resid 173"
      precision: 0.2

orientation:
  method: auto
  topology: out

membrane:
  lipids:
    POPC: 1.0
  optimize_size: true
  safety_margin_nm: 1.2
  water_pad_nm: 1.2
  ionic_strength_M: 0.15

compute:
  max_gpu_hours: 1.0
  max_wall_hours: 12

