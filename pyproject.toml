[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptamem"
version = "0.1.0"
description = "Question-conditioned membrane-protein MD — cheapest sufficient simulation, not a 100 ns default"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eric Snow" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
sim = ["openmm>=8.1", "pdbfixer>=1.9", "mdtraj>=1.10"]

[project.scripts]
adaptamem = "adaptamem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptamem = ["resources/*.yaml", "resources/lipids/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adaptamem"]
known-local-folder = ["pdbutil"]
